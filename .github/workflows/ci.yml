name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: semantic-knowledge-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SemanticKnowledge.NET.slnx
      - name: Build
        run: dotnet build SemanticKnowledge.NET.slnx --configuration Release --no-restore
      - name: Test core
        run: dotnet test tests/SemanticKnowledge.NET.Tests/SemanticKnowledge.NET.Tests.csproj --configuration Release --no-build
      - name: Test SQLite registration
        run: dotnet test tests/SemanticKnowledge.NET.Sqlite.Tests/SemanticKnowledge.NET.Sqlite.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~RegistrationTests"
      - name: Test SQLite end-to-end
        run: dotnet test tests/SemanticKnowledge.NET.Sqlite.Tests/SemanticKnowledge.NET.Sqlite.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~EndToEndTests"
      - name: Test SQLite advanced search
        run: dotnet test tests/SemanticKnowledge.NET.Sqlite.Tests/SemanticKnowledge.NET.Sqlite.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~AdvancedSearchTests"
      - name: Test SQLite embedding spaces and atomic snapshots
        run: dotnet test tests/SemanticKnowledge.NET.Sqlite.Tests/SemanticKnowledge.NET.Sqlite.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~SnapshotAndEmbeddingSpaceTests"
      - name: Test SQLite staged snapshot recovery
        run: dotnet test tests/SemanticKnowledge.NET.Sqlite.Tests/SemanticKnowledge.NET.Sqlite.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~SnapshotRecoveryTests"
      - name: Test SQLite snapshot reset
        run: dotnet test tests/SemanticKnowledge.NET.Sqlite.Tests/SemanticKnowledge.NET.Sqlite.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~SnapshotResetTests"
      - name: Test SQLite collection routing indexes
        run: dotnet test tests/SemanticKnowledge.NET.Sqlite.Tests/SemanticKnowledge.NET.Sqlite.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~CatalogRoutingIndexTests"
      - name: Test SQLite lifecycle
        run: dotnet test tests/SemanticKnowledge.NET.Sqlite.Tests/SemanticKnowledge.NET.Sqlite.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~LifecycleTests"
      - name: Test SQLite workflows
        run: dotnet test tests/SemanticKnowledge.NET.Sqlite.Tests/SemanticKnowledge.NET.Sqlite.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~WorkflowTests"
      - name: Test SQLite archives
        run: dotnet test tests/SemanticKnowledge.NET.Sqlite.Tests/SemanticKnowledge.NET.Sqlite.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~ArchiveTests"
