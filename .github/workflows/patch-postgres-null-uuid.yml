name: Patch PostgreSQL nullable UUID parameter

on:
  push:
    branches:
      - feature/embedding-spaces-atomic-sync

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/embedding-spaces-atomic-sync
      - name: Patch nullable parent UUID parameter
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/SemanticKnowledge.NET.PostgreSql/PostgreSqlKnowledgeStorageProvider.cs')
          text = path.read_text()
          old = 'command.Parameters.AddWithValue("parent", (object?)parent ?? DBNull.Value);'
          new = 'command.Parameters.Add(new NpgsqlParameter("parent", NpgsqlTypes.NpgsqlDbType.Uuid) { Value = (object?)parent ?? DBNull.Value });'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one nullable parent parameter occurrence, found {count}.')
          path.write_text(text.replace(old, new))
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SemanticKnowledge.NET.PostgreSql/PostgreSqlKnowledgeStorageProvider.cs
          git commit -m "fix(postgres): type nullable root collection parent as uuid"
          git push origin HEAD:feature/embedding-spaces-atomic-sync
