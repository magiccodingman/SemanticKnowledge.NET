name: Native AOT integration

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

concurrency:
  group: semantic-knowledge-aot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  aot-core:
    name: Core AOT ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish NativeAOT smoke
        run: dotnet publish tests/SemanticKnowledge.AotSmoke/SemanticKnowledge.AotSmoke.csproj --configuration Release --runtime ${{ matrix.rid }} -p:PublishAot=true --output artifacts/aot
      - name: Run NativeAOT smoke
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { 'artifacts/aot/SemanticKnowledge.AotSmoke.exe' } else { 'artifacts/aot/SemanticKnowledge.AotSmoke' }
          & $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  native-abi:
    name: C ABI ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Publish NativeAOT shared library
        run: dotnet publish src/SemanticKnowledge.Native/SemanticKnowledge.Native.csproj --configuration Release --runtime ${{ matrix.rid }} -p:PublishAot=true -p:NativeLib=Shared --output artifacts/native
      - name: Compile standalone C consumer
        shell: pwsh
        run: |
          if ($IsWindows) {
            cl /nologo /I src/SemanticKnowledge.Native/include native/smoke/c/main.c /Fe:artifacts/native/native-smoke.exe
          }
          elseif ($IsMacOS) {
            cc native/smoke/c/main.c -I src/SemanticKnowledge.Native/include -ldl -o artifacts/native/native-smoke
          }
          else {
            cc native/smoke/c/main.c -I src/SemanticKnowledge.Native/include -ldl -o artifacts/native/native-smoke
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run C ABI smoke
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.dll' } elseif ($IsMacOS) { '.dylib' } else { '.so' }
          $library = Get-ChildItem artifacts/native -File | Where-Object { $_.Name -like "*SemanticKnowledge.Native*$extension" } | Select-Object -First 1
          if (-not $library) { throw 'NativeAOT shared library was not produced.' }
          $smoke = if ($IsWindows) { 'artifacts/native/native-smoke.exe' } else { 'artifacts/native/native-smoke' }
          & $smoke $library.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
